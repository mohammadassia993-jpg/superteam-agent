name: Register Superteam Agent

on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Register Agent with Superteam
        run: curl -s -X POST https://superteam.fun/api/agents -H "Content-Type: application/json" -d '{"name":"PriceHunterAgent"}'
