name: Run Superteam Agent

on:
  schedule:
    - cron: '0 * * * *'   # تشغيل كل ساعة بالضبط (عند الدقيقة 0)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python agent.py
        env:
          SUPERTEAM_API_KEY: ${{ secrets.SUPERTEAM_API_KEY }}
          PHANTOM_WALLET: ${{ secrets.PHANTOM_WALLET }}
